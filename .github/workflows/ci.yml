# GitHub Actions CI for Macros.
#
# Jobs: rustfmt (formatting), the cargo-deny dependency gate (job `licenses`), and clippy (lints)
# plus the test suite on Linux and macOS, and a `cargo check` on Windows. `fmt`
# and `deny` are light (no compile, no system libs). The Linux jobs compile the
# crate, which links gpui's Linux backend and ~18 tree-sitter C grammars —
# hence the apt build dependencies below. macOS is the primary platform, so it
# gets clippy and tests too: that is the only place the AppKit spellchecker
# (src/spell.rs), the self-update bundle swap (src/update.rs) and the vendored
# gpui Metal shader patch are compiled.
#
# Release builds and the web deploy stay on the self-hosted Forgejo runners
# (.forgejo/workflows/), which hold the signing and publishing secrets.
#
# If a `*-sys` crate fails to build on Linux complaining about a missing
# library, add the corresponding `-dev` package to the "Install system deps"
# step.

name: CI

# PRs run on `pull_request`; `push` is limited to main so a PR branch isn't
# checked twice (once per event). The push run re-checks main after a merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep the cached target/ small. Incremental-compilation data is most of
  # target/ and is rarely reused between CI runs, and line tables are all a
  # test backtrace needs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rustfmt)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all --check

  licenses:
    # Dependency gate (policy in deny.toml). The job keeps its old `licenses`
    # id because the main-branch ruleset requires a check by that name, but it
    # now runs every cargo-deny check: RustSec advisories, licenses that
    # conflict with redistributing Macros under MIT (GPL/AGPL/LGPL/etc.),
    # duplicate versions (warn only) and non-crates.io sources. No project
    # compile needed, so this job is light — just cargo metadata + cargo-deny.
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (cargo)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deny
        run: |
          target="x86_64-unknown-linux-musl"
          tarball="cargo-deny-${CARGO_DENY_VERSION}-${target}"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL "$url" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "${tarball}/cargo-deny"
          cargo-deny --version

      - name: Check dependencies
        run: cargo deny check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake perl \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libssl-dev

      - name: Install Rust (clippy)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-v2-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-clippy-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake perl \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libssl-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-v2-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-test-

      - name: Run tests
        run: cargo test --workspace --locked

  macos:
    # The primary platform: clippy and the test suite against the AppKit/Metal
    # backend, which the Linux jobs never compile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (clippy)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # gpui's build script compiles the (patched) Metal shaders with
      # `xcrun metal`. Recent Xcode releases ship the Metal toolchain as a
      # separate download, so fetch it when it's missing.
      - name: Ensure Metal toolchain
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-v2-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-macos-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  windows:
    # Compile-only: keeps the Windows-specific code (grammar .dll builds,
    # winresource icon embedding) from rotting between releases.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled on GitHub's Windows images; this installs the
      # toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        shell: bash
        run: rustup toolchain install

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-v2-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-check-

      - name: Cargo check
        run: cargo check --workspace --all-targets --locked
