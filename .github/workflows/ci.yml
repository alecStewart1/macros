# GitHub Actions CI for Forge (Forgemacs).
#
# Jobs: rustfmt (formatting), the dependency license gate, clippy (lints), and
# the test suite. `fmt` is light (no compile, no system libs). `clippy` and
# `test` must compile the crate, which links gpui's Linux backend, ~18
# tree-sitter C grammars, and git2's vendored OpenSSL — hence the apt build
# dependencies below.
#
# Release builds and the web deploy stay on the self-hosted Forgejo runners
# (.forgejo/workflows/), which hold the signing and publishing secrets.
#
# If a `*-sys` crate fails to build complaining about a missing library, add
# the corresponding `-dev` package to the "Install system deps" step.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep the cached target/ small. Incremental-compilation data is most of
  # target/ and is rarely reused between CI runs, and line tables are all a
  # test backtrace needs.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rustfmt)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all --check

  licenses:
    # Dependency license gate: fail if any crate is only available under a
    # license that conflicts with redistributing Macros under MIT (GPL/AGPL/
    # LGPL/etc.). Policy lives in deny.toml. No project compile needed, so this
    # job is light — just cargo metadata + cargo-deny.
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: "0.19.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (cargo)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deny
        run: |
          target="x86_64-unknown-linux-musl"
          tarball="cargo-deny-${CARGO_DENY_VERSION}-${target}"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL "$url" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "${tarball}/cargo-deny"
          cargo-deny --version

      - name: Check dependency licenses
        run: cargo deny check licenses

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake perl \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libssl-dev

      - name: Install Rust (clippy)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-v2-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-clippy-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake perl \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libssl-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-v2-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-test-

      - name: Run tests
        run: cargo test --workspace --locked
